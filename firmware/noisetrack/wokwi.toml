# NoiseTrack: configuração do Wokwi para VS Code.
# Aponta para o firmware gerado pelo PlatformIO (rode "pio run" antes de simular).
[wokwi]
version = 1
firmware = '.pio/build/esp32dev/firmware.bin'
elf = '.pio/build/esp32dev/firmware.elf'

# Página da Parte 10 no navegador do PC: http://localhost:8180
# (a página usa "porta + 1" para o WebSocket: 8181 aqui, 81 na placa).
[[net.forward]]
from = "localhost:8180"
to = "target:80"

[[net.forward]]
from = "localhost:8181"
to = "target:81"
