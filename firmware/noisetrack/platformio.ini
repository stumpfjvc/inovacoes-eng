; NoiseTrack: projeto PlatformIO para ESP32.
; Os arquivos de código ficam nesta mesma pasta (src_dir = .), então
; noisetrack.ino, config.h, leds.cpp e buzzer.cpp continuam onde estão.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel
